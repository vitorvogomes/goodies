[project]
name = "goodies-api"
version = "0.0.0"
description = "Goodies — backend FastAPI (ledger, portfolio, market, analytics)"
requires-python = ">=3.12"
readme = "../README.md"

# Stack travada pelo spine v2 (Story 1.3). Piso (>=) = versão travada; o uv.lock fixa a exata.
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.3",
    "asyncpg>=0.31.0",          # Postgres direto, sem ORM (conventions.md)
    "redis>=8.0.0",           # redis[asyncio] — cache local (compose)
    "httpx>=0.27",            # fetchers de mercado / wallets
    "apscheduler>=3.11.2,<4",      # workers no processo FastAPI (ADR-003, não Celery)
    "scipy>=1.17.1",            # XIRR via brentq (ADR-002)
    "python-jose[cryptography]>=3.3",  # JWT custom (ADR-006)
    "passlib[bcrypt]>=1.7",            # hash de senha (ADR-006)
    "bcrypt>=4,<5",                    # passlib 1.7.4 quebra com bcrypt 5 (00-05)
    "structlog>=25.5.0",      # logs estruturados (AD-18/AR22)
    "alembic>=1.18.4",          # migrations Postgres (00-03)
    "openpyxl>=3.1",
]

# Dev/test tools (PEP 735) — instalados por padrão no `uv sync`; excluídos com `--no-dev` (imagem).
[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

# App roda a partir do código-fonte (cwd = /app, pythonpath="."), não como wheel instalado.
# uv gerencia só o ambiente (.venv) + deps; não builda nem instala o projeto. (ADR-010)
[tool.uv]
package = false

# ---- Ruff: lint + format (substitui black) — conventions.md ----
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

# Tipografia da UI (DESIGN.md/EXPERIENCE.md): "Grupo › Subcategoria", menos tipográfico, travessão.
allowed-confusables = ["›", "−", "–", "×"]

[tool.ruff.lint.isort]
# stdlib -> third-party -> local, com linha em branco (conventions.md)
known-first-party = ["engines", "workers", "hermes", "auth", "db", "scripts", "config"]

[tool.ruff.format]
quote-style = "double"

# ---- mypy --strict — sem Any sem justificativa (conventions.md) ----
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# asyncpg/passlib/apscheduler/openpyxl não publicam stubs (py.typed) — ignora missing imports.
[[tool.mypy.overrides]]
module = ["asyncpg.*", "passlib.*", "jose.*", "apscheduler.*", "openpyxl.*"]
ignore_missing_imports = true

# ---- pytest + pytest-asyncio ----
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "dados_reais: testes contra goodies_dados, restaurado do backup real (nunca pulados no /gate)",
]

# ---- Cobertura: >=80% nas engines críticas (Portfolio, Analytics) ----
[tool.coverage.run]
branch = true
source = ["engines", "workers", "auth", "hermes"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Gate global (≥80%); o /test ainda destaca as engines críticas por arquivo.
fail_under = 80
