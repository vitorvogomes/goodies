# Goodies em dev (ADR-018; produção no Railway) — FastAPI + Postgres 15 + Redis 7. Na máquina de casa o volume
# pgdata ainda é o BANCO REAL (até o dump ir para o Railway).
# Nunca rode `docker compose down -v`: o -v apaga o volume pgdata (os seus dados). Runbook: docs/LOCAL_DEV.md.
services:
  api:
    build:
      context: ./api
    # Story 1.6: portas só no loopback; segredos do .env (editado às cegas); o environment abaixo
    # sobrescreve as URLs do .env (que apontam para localhost, uso no host).
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://goodies:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/goodies
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}@redis:6379/0
      # Story 1.2: backups em BACKUP_DIR do .env (host), montado em /backups; sem migração automática.
      BACKUP_DIR: /backups
      BACKUP_DIR_HOST: ${BACKUP_DIR:?defina BACKUP_DIR no .env}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Story 1.2: sem bind mount do código e sem --reload — o serviço do banco real roda a imagem
    # construída (`docker compose up -d --build api` para atualizar). A subida é scripts.ops.startup.
    volumes:
      - ${BACKUP_DIR:?defina BACKUP_DIR no .env}:/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: goodies
      # Só vale na criação do volume; num volume existente a senha muda por ALTER USER (LOCAL_DEV.md).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: goodies
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodies"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
